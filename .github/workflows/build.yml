# The Linux (aarch64) AppImage, built in tools/native/linux.Dockerfile's
# environment (Debian 12: glibc 2.36) on an arm64 runner, and the Android
# APK (debug-signed), built as android/README.md describes.
name: Build

# By hand or on a release tag: a build takes about half an hour.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # git describe: the AppImage's version
      - name: FEX submodules
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse
      - uses: actions/cache@v6
        with:
          path: build/native-deps
          key: native-deps-${{ hashFiles('tools/native/deps.sh') }}
      - name: Build environment
        run: docker build -t hakux-linux -f tools/native/linux.Dockerfile tools/native
      - name: Build
        run: docker run --rm -v "$PWD":/src -w /src hakux-linux tools/native/appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: hakuX-linux-aarch64
          path: build/hakuX-*-aarch64.AppImage
          if-no-files-found: error

  apk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - name: FEX submodules
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse
      - uses: actions/cache@v6
        with:
          path: build/native-deps
          key: native-deps-${{ hashFiles('tools/native/deps.sh') }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Toolchain
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.1.0" > /dev/null
      - name: Native core
        run: |
          tools/native/deps.sh
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$PWD/build/native-deps"
          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh
      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug   # gradle.properties names its own JDK
      - uses: actions/upload-artifact@v7
        with:
          name: hakuX-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
